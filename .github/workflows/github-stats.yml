name: Generate GitHub Stats Images

on:
  schedule:
    # Runs every day at 00:00 UTC — ubah sesuai kebutuhan (misal '0 */6 * * *' untuk tiap 6 jam)
    - cron: "0 0 * * *"
  workflow_dispatch: {}  # biar bisa di-trigger manual dari tab "Actions"
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate stats images
        uses: jstrieb/github-stats@master
        with:
          username: noneedhere
          access_token: ${{ secrets.ACCESS_TOKEN }}
          exclude_repos: ""
          exclude_langs: "HTML,CSS"
          exclude_forked_repos: "true"
